<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴伴侣 · 深度重构与正向支持</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #0b1120, #1e1b4b, #172554, #020617);
            --card-bg: rgba(30, 41, 59, 0.8);
            --primary: #38bdf8;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body {
            background: var(--bg-gradient); background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text); min-height: 100vh; display: flex; justify-content: center;
            padding: 20px 20px 40px; overflow-x: hidden;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app {
            width: 100%; max-width: 800px;
            background: var(--card-bg); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 24px; padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7); position: relative;
        }

        .breathing-ring {
            position: absolute; top: -60px; right: -60px; width: 200px; height: 200px;
            border-radius: 50%; background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%);
            animation: breathe 8s ease-in-out infinite; pointer-events: none;
        }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.5); opacity: 0.8; } }

        h1 { font-size: 26px; color: #fff; text-align: center; margin-bottom: 8px; letter-spacing: 2px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }

        .input-group { position: relative; margin-bottom: 20px; }
        textarea {
            width: 100%; height: 120px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 15px; line-height: 1.7; outline: none; resize: vertical;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }

        .action-btn {
            width: 100%; padding: 16px; border: none; border-radius: var(--radius);
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5); }

        .result-section { display: none; margin-top: 30px; animation: fadeIn 0.6s ease forwards; }
        .result-section.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 25px; margin-bottom: 20px; position: relative;
        }

        .emotion-result { border-left: 4px solid #c4b5fd; display: flex; justify-content: space-between; align-items: center; }
        .emotion-result h3 { font-size: 15px; color: #c4b5fd; }
        .emotion-result .emotion-name { font-size: 18px; font-weight: bold; color: #fff; }
        .emotion-result .match-reason { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

        .guidance-card { border-left: 4px solid #38bdf8; }
        .guidance-card h3 { font-size: 16px; color: #7dd3fc; margin-bottom: 15px; font-weight: 600; }
        .guidance-card p { font-size: 15px; line-height: 2; color: #e2e8f0; }

        /* 心理学盲盒 */
        .psychology-card { 
            border-left: 4px solid #a78bfa; 
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(56, 189, 248, 0.08));
        }
        .psychology-card h3 { font-size: 16px; color: #c4b5fd; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .psychology-item { margin-bottom: 25px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 20px; }
        .psychology-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .psychology-item .term { font-size: 15px; color: #c4b5fd; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .psychology-item .term span { background: rgba(167, 139, 250, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 12px; color: #a78bfa; }
        .psychology-item .explain { font-size: 14px; color: #cbd5e1; line-height: 1.9; margin-bottom: 12px; }
        .psychology-item .reframe { font-size: 14px; color: #4ade80; background: rgba(34, 197, 94, 0.1); padding: 12px 15px; border-radius: 10px; border-left: 3px solid #22c55e; line-height: 1.8; }
        
        .video-section {
            background: rgba(34, 197, 94, 0.05); border: 1px solid rgba(34, 197, 94, 0.2);
            border-left: 4px solid #22c55e; text-align: center; padding: 25px;
        }
        .video-section h3 { font-size: 15px; color: #4ade80; margin-bottom: 12px; }
        .video-desc { font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 20px; }
        .video-link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 30px; border-radius: 25px; background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff; font-size: 14px; font-weight: bold; text-decoration: none; transition: all 0.3s;
        }
        .video-link-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4); color: #fff; }

        .audio-section { border-left: 4px solid #fbbf24; text-align: center; padding: 20px; }
        .audio-section h4 { font-size: 13px; color: #fbbf24; margin-bottom: 12px; }
        .audio-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 25px; border-radius: 25px; border: 1px solid var(--primary);
            background: rgba(56, 189, 248, 0.1); color: var(--primary); font-size: 14px; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
        }
        .audio-btn:hover { background: var(--primary); color: #000; }
        .audio-btn.active { background: var(--danger); border-color: var(--danger); color: #fff; }

        .footer-note { text-align: center; font-size: 11px; color: #475569; margin-top: 25px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="app">
    <div class="breathing-ring"></div>
    <h1>🌿 心晴伴侣</h1>
    <div class="subtitle">用心理学重构认知，陪你看见每一种情绪</div>

    <div class="input-group">
        <textarea id="userInput" placeholder="写下此刻你脑海中最真实的想法...&#10;&#10;例如：我觉得自己好没用，什么事都做不好。&#10;或者：今天我帮朋友解决了难题，我好开心！"></textarea>
    </div>
    <button class="action-btn" onclick="startAnalysis()">✨ 让我来陪陪你</button>

    <div class="result-section" id="resultSection">
        
        <div class="card emotion-result">
            <div>
                <h3>🎯 识别到的情绪</h3>
                <div class="match-reason" id="matchReason">正在分析...</div>
            </div>
            <div class="emotion-name" id="emotionName">未知</div>
        </div>

        <div class="card guidance-card">
            <h3>💙 我想对你说</h3>
            <p id="guidanceText"></p>
        </div>

        <!-- 心理学盲盒：随机抽取 -->
        <div class="card psychology-card" id="psychologyCard">
            <h3>🧠 心理学视角</h3>
            <div id="psychologyContent">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="card video-section">
            <h3>🎬 为你精选的视频疗愈</h3>
            <div class="video-desc" id="videoDesc">正在匹配专属视频...</div>
            <a class="video-link-btn" id="videoLinkBtn" href="#" target="_blank">
                <span>▶️</span>
                <span id="videoBtnText">点击观看</span>
            </a>
        </div>

        <div class="card audio-section">
            <h4>🎧 专属疗愈音频</h4>
            <button class="audio-btn" id="audioBtn" onclick="toggleHealingAudio()">▶️ 播放舒缓音波</button>
        </div>

        <div class="footer-note">
            本工具基于 CBT 认知行为疗法框架提供初步梳理，不能替代专业心理咨询。如果情绪持续困扰，请务必寻求专业帮助。
        </div>
    </div>
</div>

<script>

                    reframe: "当你觉得“一切都没希望”时，告诉自己：“这是我抑郁的情绪在说话，这不是客观现实。等我休息好了，看到的世界会不一样。”"
                }
            ],

            videoUrl: 'https://mms.baidu.com/sf/vsearch?pd=video&tn=vsearch&ie=utf-8&wd=抑郁低落+行为激活+心理疏导',
            videoBtnText: '观看：走出低落的微小行动'
        },
        {
            id: 'anger',
            name: '愤怒与烦躁',
            color: '#f59e0b',
            keywords: ['愤怒', '生气', '烦躁', '火大', '看不惯', '凭什么', '不公平', '气死', '烦死', '讨厌'],
            guidance: [
                "我能感觉到你心里的那团火。愤怒通常是因为界限被侵犯，或者某种‘应该’被打破。你的愤怒是合理的，它在保护你。\n\n**我们先不急着灭火。**试着用力握紧拳头 5 秒，然后猛地松开，感受那种松弛感。"
            ],
            psychology: [
                {
                    term: "非理性信念（阿尔伯特·埃利斯）",

                    reframe: "试着把‘必须’降级为‘我希望’。这会给你留出喘息的空间。把“他凭什么这样”换成“他这样做让我很失望，我希望他能尊重我”。"
                },
                {

                    tag: "精神分析",

                    reframe: "把愤怒变成改变现实的动力。去运动、写日记、或者打扫卫生，让这股能量流走，而不是灼伤自己。"
                }
            ],
            videoDesc: "愤怒是一种强烈的能量，它在保护你，但也可能灼伤你。这段视频将带你探索愤怒背后的核心需求，学习如何在不伤害自己和他人的前提下，表达你的力量。",
            videoUrl: 'https://mms.baidu.com/sf/vsearch?pd=video&tn=vsearch&ie=utf-8&wd=愤怒管理+CBT+情绪控制',
            videoBtnText: '观看：如何驾驭你的愤怒'
        }
    ];

    // ... (音频引擎保持不变，省略以节省篇幅，实际粘贴时保留)
    let audioCtx = null; let audioNodes = []; let isPlaying = false;
    function toggleHealingAudio() {
        const btn = document.getElementById('audioBtn');
        if (isPlaying) { stopAudio(); btn.innerText = '▶️ 播放舒缓音波'; btn.classList.remove('active'); isPlaying = false; } 
        else { startAudio(); btn.innerText = '⏸️ 正在播放 (点击暂停)'; btn.classList.add('active'); isPlaying = true; }
    }
    function startAudio() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const bufferSize = audioCtx.sampleRate * 4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) { const white = Math.random() * 2 - 1; data[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = data[i]; data[i] *= 3.5; }
            const noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = buffer; noiseSource.loop = true;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
            const gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(0, audioCtx.currentTime); gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 2);
            noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); noiseSource.start();
            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = 10; oscGain.gain.value = 0.02;
            osc.connect(oscGain); oscGain.connect(audioCtx.destination); osc.start();
            audioNodes = [noiseSource, osc];
        } catch (e) { alert('浏览器无法播放疗愈音频。'); }
    }
    function stopAudio() { audioNodes.forEach(node => { try { node.stop(); } catch(e){} }); if (audioCtx) { audioCtx.close(); audioCtx = null; } audioNodes = []; }

    // ================= 情绪分析引擎 =================
    function analyzeEmotion(text) {
        let bestMatch = null;
        let bestScore = 0;
        let matchReason = "";

        emotionData.forEach(emo => {
            let score = 0;
            let hits = [];
            
            emo.keywords.forEach(k => {
                if (text.includes(k)) { score += 2; hits.push(k); }
            });

            // 句式加权
            if (emo.id === 'positive') {
                if (/开心|快乐|顺利|成功|很好|棒|骄傲|舒服|爽/.test(text)) { score += 5; hits.push("正向表达"); }
            }
            if (emo.id === 'self_blame') {
                if (/都是我.*错|我.*不好|我.*没用|我.*失败|我.*不行|做不好/.test(text)) { score += 5; hits.push("自责句式"); }
            }
            if (emo.id === 'ignored') {
                if (/不.*理我|没.*回我|不.*理.*人|沉默|忽视/.test(text)) { score += 5; hits.push("被忽视句式"); }
            }
            if (emo.id === 'anxiety') {
                if (/万一|如果.*怎么|怕.*发生|担心.*未来/.test(text)) { score += 5; hits.push("未来担忧句式"); }
            }
            if (emo.id === 'depression') {
                if (/没.*意思|不想.*动|没.*希望|活着.*累|好累|没.*意义/.test(text)) { score += 5; hits.push("无力绝望句式"); }
            }

            if (score > bestScore) { bestScore = score; bestMatch = emo; matchReason = hits.length > 0 ? `命中关键词：${hits.join("、")}` : "基于句式结构判断"; }
        });

        // 兜底逻辑：如果没有匹配到任何情绪，默认走“积极/平静”
        if (!bestMatch || bestScore === 0) {
            bestMatch = emotionData.find(e => e.id === 'positive') || emotionData[0];
            matchReason = "未匹配到负面关键词，默认引导至积极平静";
        }

        return { emotion: bestMatch, reason: matchReason };
    }

    // ================= 核心渲染逻辑 =================
    function startAnalysis() {
        const text = document.getElementById('userInput').value.trim();
        if (!text) { alert('请先写下你的想法...'); return; }

        const result = analyzeEmotion(text);
        const matchedEmotion = result.emotion;

        document.getElementById('emotionName').innerText = matchedEmotion.name;
        document.getElementById('emotionName').style.color = matchedEmotion.color;
        document.getElementById('matchReason').innerText = `分析依据：${result.reason}`;

        const randomGuidance = matchedEmotion.guidance[Math.floor(Math.random() * matchedEmotion.guidance.length)];
        document.getElementById('guidanceText').innerHTML = `你说：“<span style="color:#facc15; font-style:italic;">${text.length > 30 ? text.substring(0, 30) + '...' : text}</span>”<br><br>${randomGuidance.replace(/\n/g, '<br>')}`;

        // 🌟 核心修改：随机抽取心理学盲盒
        const psychContent = document.getElementById('psychologyContent');
        let psychHtml = '';
        
        if (matchedEmotion.psychology && matchedEmotion.psychology.length > 0) {
            // 打乱数组，随机抽取最多3个理论
            const shuffled = [...matchedEmotion.psychology].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            
            selected.forEach((item) => {
                psychHtml += `
                    <div class="psychology-item">
                        <div class="term">🔹 ${item.term} <span>${item.tag}</span></div>
                        <div class="explain">${item.explain}</div>
                        <div class="reframe">💡 认知重构练习：${item.reframe}</div>
                    </div>
                `;
            });
        } else {
            psychHtml = '<p style="color:#94a3b8; font-size:14px;">本次未匹配到专门的心理学解析。</p>';
        }
        psychContent.innerHTML = psychHtml;

        document.getElementById('videoDesc').innerText = matchedEmotion.videoDesc;
        document.getElementById('videoLinkBtn').href = matchedEmotion.videoUrl;
        document.getElementById('videoBtnText').innerText = matchedEmotion.videoBtnText;

        const section = document.getElementById('resultSection');
        section.classList.remove('show');
        void section.offsetWidth;
        section.classList.add('show');
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
